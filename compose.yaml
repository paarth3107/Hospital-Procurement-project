
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Points at the SAME remote MySQL instance this app already uses for
      # local dev (backend/.env's DATABASE_URL) -- deliberately not a locally
      # created database (2026-10-14, user-directed: this file used to spin
      # up its own fresh MySQL container + volume, which isn't what actually
      # gets deployed). Set this in the server's own .env to the exact same
      # connection string, so this deployment reads/writes the one real
      # database, not a separate empty one.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the server .env file -- the same remote MySQL instance this app already uses, not a new database}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the server .env file}
    ports:
      - "127.0.0.1:8000:8000"
